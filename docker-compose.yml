services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mouse_tracker}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-mouse_tracker_prod}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      # Without -d, pg_isready defaults dbname to the same value as -U (libpq default),
      # which isn't POSTGRES_DB here — every check then hits a real "database ... does
      # not exist" FATAL in the postgres log. pg_isready still counts that as "server is
      # up" (any error besides "not accepting connections yet" does), so this was log
      # noise rather than a functional failure, but pointing it at the real db avoids it.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mouse_tracker} -d ${POSTGRES_DB:-mouse_tracker_prod}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: "ecto://${POSTGRES_USER:-mouse_tracker}:${POSTGRES_PASSWORD}@db/${POSTGRES_DB:-mouse_tracker_prod}"
      SECRET_KEY_BASE: "${SECRET_KEY_BASE:?generate one with: mix phx.gen.secret}"
      PHX_HOST: "${PHX_HOST:?set PHX_HOST to the VMs LAN IP, e.g. 10.0.42.86}"
      PORT: "${PORT:-4000}"
      PHX_SERVER: "true"
      OBAN_VIDEO_PROCESSING_CONCURRENCY: "${OBAN_VIDEO_PROCESSING_CONCURRENCY:-4}"
      SMTP_HOST: "${SMTP_HOST:?set SMTP_HOST, registration and magic-link emails need a working mailer}"
      SMTP_PORT: "${SMTP_PORT:-587}"
      SMTP_USERNAME: "${SMTP_USERNAME}"
      SMTP_PASSWORD: "${SMTP_PASSWORD}"
      SMTP_SSL: "${SMTP_SSL:-false}"
    volumes:
      # Videos, extracted frames, heatmaps/speed-profile PNGs — must persist across
      # container rebuilds/restarts. /app/priv is a symlink (set up in the Dockerfile)
      # to the release's actual (version-qualified) priv dir, served via Plug.Static.
      - uploads:/app/priv/static/uploads
    expose:
      # Not published to the host/LAN directly — only reachable through caddy below.
      - "4000"
    command: >
      sh -c "/app/bin/migrate && /app/bin/server"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  db_data:
  uploads:
  # Holds Caddy's internal CA root + issued leaf certs — keep this persistent, or every
  # recreation mints a new root CA and every client that trusted the old one breaks.
  caddy_data:
  caddy_config:
